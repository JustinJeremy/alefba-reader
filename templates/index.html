<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persian letter reader</title>
<style>
:root{--ink:#1d2433;--paper:#f3f5f9;--line:#c9d0de;--accent:#1f4fd8}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;color:var(--ink);background:var(--paper);min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(720px,100%);display:grid;gap:20px}
h1{font-size:2rem;margin:0}p.sub{margin:4px 0 0;color:#55607a}
#drop{border:2px dashed var(--line);background:#fff;border-radius:6px;min-height:280px;display:grid;place-items:center;text-align:center;padding:16px;cursor:pointer}
#drop.over{border-color:var(--accent)}
#drop img{max-width:100%;max-height:260px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button,label.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:4px;padding:10px 16px;cursor:pointer}
button.alt,label.btn{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,label.btn:focus-within,#drop:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
button:disabled{opacity:.5}
#result{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px;display:none;gap:24px;align-items:center}
#result .big{font-size:5rem;line-height:1;direction:rtl}
#latin{font-size:2.4rem;font-weight:bold}
.alts{color:#55607a;margin-top:6px}
#err{color:#b3261e;min-height:1.4em}
input[type=file]{display:none}
[hidden]{display:none!important}
</style></head><body><main>
<header><h1>Persian letter reader</h1>
<p class="sub">Upload or photograph one isolated Persian letter to get its English spelling.</p></header>
<div id="drop" tabindex="0" role="button" aria-label="Choose an image"><span id="hint">Drop an image here, or click to choose one</span></div>
<div class="row">
 <button class="alt" id="camBtn" type="button">Take photo</button>
 <button class="alt" id="mirrorBtn" type="button" aria-pressed="false" hidden>Mirror preview: off</button>
 <button class="alt" id="flipBtn" type="button" hidden>Switch camera</button><input id="cam" type="file" accept="image/*" capture="environment">
 <label class="btn">Choose file<input id="file" type="file" accept="image/*"></label>
 <button id="go" disabled>Read letter</button>
</div>
<div id="err" role="alert"></div>
<section id="result" aria-live="polite">
 <div class="big" id="letter"></div>
 <div><div id="latin"></div><div id="name" class="alts"></div><div id="conf"></div><div class="alts" id="alts"></div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);let current=null,stream=null,mirrored=false,facing="environment";
function showCamControls(on){$("mirrorBtn").hidden=!on;$("flipBtn").hidden=!on}
function applyMirror(){const v=$("drop").querySelector("video");if(v)v.style.transform=mirrored?"scaleX(-1)":"none";
 $("mirrorBtn").textContent="Mirror preview: "+(mirrored?"on":"off");$("mirrorBtn").setAttribute("aria-pressed",mirrored)}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$("camBtn").textContent="Take photo";showCamControls(false)}
function setFile(f){if(!f)return;stopCam();current=f;$("err").textContent="";$("result").style.display="none";
 const img=new Image();img.src=URL.createObjectURL(f);img.alt="Selected image";
 $("drop").replaceChildren(img);$("go").disabled=false;}
$("file").onchange=e=>setFile(e.target.files[0]);
$("cam").onchange=e=>setFile(e.target.files[0]);
$("drop").onclick=()=>{if(!stream)$("file").click()};
$("drop").onkeydown=e=>{if(e.key==="Enter"||e.key===" ")$("file").click()};
$("drop").ondragover=e=>{e.preventDefault();$("drop").classList.add("over")};
$("drop").ondragleave=()=>$("drop").classList.remove("over");
$("drop").ondrop=e=>{e.preventDefault();$("drop").classList.remove("over");setFile(e.dataTransfer.files[0])};

async function openStream(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 const tries=[{video:{facingMode:{ideal:facing}}},{video:true}];
 let lastErr;
 for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){lastErr=e}}
 if(!stream)throw lastErr;
 const v=document.createElement("video");v.autoplay=true;v.muted=true;v.playsInline=true;v.setAttribute("playsinline","");
 v.srcObject=stream;v.style.cssText="max-width:100%;max-height:260px";
 $("drop").replaceChildren(v);
 // follow what the browser actually gave us (laptops have no rear camera)
 const fm=stream.getVideoTracks()[0].getSettings().facingMode;if(fm)facing=fm;
 // preview un-mirrored by default so a letter held up to the camera reads the right way round
 mirrored=false;applyMirror();
 try{await v.play()}catch(e){}
}
function captureFrame(){
 const v=$("drop").querySelector("video");
 if(!v||!v.videoWidth){$("err").textContent="Camera is still starting, try again in a moment.";return}
 const c=document.createElement("canvas");c.width=v.videoWidth;c.height=v.videoHeight;
 // never mirror the saved photo: the raw frame shows the paper the right way round,
 // and a mirrored Persian letter looks like a different letter
 c.getContext("2d").drawImage(v,0,0);
 c.toBlob(b=>setFile(new File([b],"capture.jpg",{type:"image/jpeg"})),"image/jpeg",0.95);
}
$("camBtn").onclick=async()=>{
 if(stream){captureFrame();return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  $("err").textContent="Live camera needs https or localhost. Using the file picker instead.";$("cam").click();return}
 try{await openStream();
  $("camBtn").textContent="Capture";showCamControls(true);$("go").disabled=true;$("err").textContent="";
 }catch(e){stream=null;showCamControls(false);
  $("err").textContent=(e&&e.name==="NotAllowedError"?"Camera permission was denied.":"Camera not available.")+" Choose a file instead.";
  $("cam").click()}};
$("mirrorBtn").onclick=()=>{mirrored=!mirrored;applyMirror()};
$("flipBtn").onclick=async()=>{
 facing=facing==="user"?"environment":"user";
 try{await openStream()}catch(e){$("err").textContent="Could not switch camera."}};
$("go").onclick=async()=>{
 $("go").disabled=true;$("go").textContent="Reading...";$("err").textContent="";
 try{const fd=new FormData();fd.append("image",current);
  const r=await fetch("/predict",{method:"POST",body:fd});const d=await r.json();
  if(!r.ok)throw new Error(d.error||"Something went wrong.");
  const [t,...rest]=d.results;
  $("letter").textContent=t.letter;$("latin").textContent=t.latin;
  $("name").textContent=t.name+(t.ascii!==t.latin?" · plain: "+t.ascii:"");
  $("conf").textContent="Confidence "+Math.round(t.confidence*100)+"%"+(t.confidence<0.6?" (low: retake the photo)":"");
  $("alts").textContent="Other guesses: "+rest.map(x=>x.letter+" "+x.latin+" ("+x.name+") "+Math.round(x.confidence*100)+"%").join(", ");
  $("result").style.display="flex";
 }catch(e){$("err").textContent=e.message}
 $("go").textContent="Read letter";$("go").disabled=false;};
</script></body></html>
